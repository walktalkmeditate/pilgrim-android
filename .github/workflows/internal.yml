name: Play Internal

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.1). Empty = keep current.'
        required: false
        type: string

concurrency:
  group: play-internal-${{ github.ref }}
  cancel-in-progress: false

env:
  MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

jobs:
  publish-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pilgrim-release.keystore || { echo "base64 decode failed for KEYSTORE_BASE64"; exit 1; }

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=pilgrim-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Write local.properties
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"
            echo "MAPBOX_DOWNLOADS_TOKEN=$MAPBOX_DOWNLOADS_TOKEN"
          } > local.properties

      - name: Decode Play service account JSON (fail-fast)
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > play-service-account.json || { echo "base64 decode failed for PLAY_SERVICE_ACCOUNT_JSON_BASE64"; exit 1; }
          if ! grep -q '"client_email"' play-service-account.json; then
            echo "Decoded service-account JSON missing client_email — credential malformed."
            exit 1
          fi

      - name: Set versionName (if input provided)
        if: inputs.version != ''
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Invalid versionName '$NEW_VERSION' — must match SemVer (e.g. 1.0.1 or 1.0.1-rc1)." >&2
            exit 1
          fi
          sed -i 's/versionName = ".*"/versionName = "'"$NEW_VERSION"'"/' app/build.gradle.kts
          grep -q "versionName = \"$NEW_VERSION\"" app/build.gradle.kts || { echo "sed failed to set versionName"; exit 1; }

      - name: Bump versionCode (git rev-list --count HEAD)
        run: |
          NEW_CODE=$(git rev-list --count HEAD)
          sed -i 's/versionCode = [0-9]*/versionCode = '"$NEW_CODE"'/' app/build.gradle.kts
          grep -q "versionCode = $NEW_CODE" app/build.gradle.kts || { echo "sed failed to set versionCode"; exit 1; }

      - name: Build signed AAB
        run: ./gradlew bundleRelease

      - name: Publish to Play Internal
        run: ./gradlew publishReleaseBundle --track internal
