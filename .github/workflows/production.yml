name: Play Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.1). Empty = keep current.'
        required: false
        type: string

concurrency:
  group: play-production-${{ github.ref }}
  cancel-in-progress: false

env:
  MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

jobs:
  publish-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NOTE: pushes directly to main as github-actions[bot]. Any future branch
    # protection on main must allowlist this identity or this workflow breaks
    # post-Play-upload (half-shipped state).
    permissions:
      contents: write  # need push for bump commit + tag, and release creation
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full history for git rev-list --count HEAD + push tags + commits cleanly
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pilgrim-release.keystore || { echo "base64 decode failed"; exit 1; }

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=pilgrim-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Write local.properties
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"
            echo "MAPBOX_DOWNLOADS_TOKEN=$MAPBOX_DOWNLOADS_TOKEN"
          } > local.properties

      - name: Decode Play service account JSON (fail-fast)
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > play-service-account.json || { echo "base64 decode failed"; exit 1; }
          if ! grep -q '"client_email"' play-service-account.json; then
            echo "Decoded service-account JSON missing client_email — credential malformed."
            exit 1
          fi

      - name: Set versionName (if input provided)
        if: inputs.version != ''
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Invalid versionName '$NEW_VERSION' — must match SemVer (e.g. 1.0.1 or 1.0.1-rc1)." >&2
            exit 1
          fi
          sed -i 's/versionName = ".*"/versionName = "'"$NEW_VERSION"'"/' app/build.gradle.kts
          grep -q "versionName = \"$NEW_VERSION\"" app/build.gradle.kts || { echo "sed failed to set versionName"; exit 1; }

      - name: Bump versionCode (git rev-list --count HEAD)
        run: |
          NEW_CODE=$(git rev-list --count HEAD)
          sed -i 's/versionCode = [0-9]*/versionCode = '"$NEW_CODE"'/' app/build.gradle.kts
          grep -q "versionCode = $NEW_CODE" app/build.gradle.kts || { echo "sed failed to set versionCode"; exit 1; }
          echo "VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"

      - name: Capture versionName for downstream steps
        run: |
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/versionName = "([^"]+)"/\1/')
          if [ -z "$VN" ]; then
            echo "Failed to extract versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"

      - name: Verify tag v${{ env.VERSION_NAME }} does not exist
        run: |
          if git rev-parse "v${VERSION_NAME}" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "v${VERSION_NAME}" >/dev/null 2>&1; then
            echo "Tag v${VERSION_NAME} already exists locally or on remote — refusing to overwrite." >&2
            exit 1
          fi

      - name: Generate release notes
        run: bash scripts/release-notes.sh "$VERSION_NAME"

      - name: Build signed AAB
        run: ./gradlew bundleRelease

      - name: Build signed APK (for GH Release attachment)
        run: ./gradlew assembleRelease

      - name: Publish to Play Production (20% rollout)
        run: ./gradlew publishReleaseBundle --track production --user-fraction 0.20 --release-status inProgress

      - name: Commit versionCode/versionName bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/play/release-notes/en-US/default.txt
          git commit -m "chore(release): bump to v${VERSION_NAME} (code ${VERSION_CODE}) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Bump commit pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt — fetching + rebasing main"
            git fetch origin main
            git rebase origin/main || { echo "Rebase conflict — aborting"; git rebase --abort; exit 1; }
          done
          echo "Bump commit push failed after 3 attempts — manual recovery required" >&2
          exit 1

      - name: Create + push tag
        run: |
          git tag "v${VERSION_NAME}"
          git push origin "v${VERSION_NAME}"

      - name: Create GitHub Release with AAB + APK
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Pilgrim ${{ env.VERSION_NAME }}
          body_path: build/changelog.md
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
