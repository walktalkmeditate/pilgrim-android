name: Play Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.1). Empty = keep current.'
        required: false
        type: string

concurrency:
  group: play-production-${{ github.ref }}
  cancel-in-progress: false

env:
  GHA_VERSION_CODE_OFFSET: 100

jobs:
  publish-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # need push for bump commit + tag, and release creation
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full history to push tags + commits cleanly
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pilgrim-release.keystore

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=pilgrim-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Write local.properties
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"
            echo "MAPBOX_DOWNLOADS_TOKEN=$MAPBOX_DOWNLOADS_TOKEN"
          } > local.properties

      - name: Decode Play service account JSON (fail-fast)
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > play-service-account.json
          if ! grep -q '"client_email"' play-service-account.json; then
            echo "Decoded service-account JSON missing client_email — credential malformed."
            exit 1
          fi

      - name: Set versionName (if input provided)
        if: inputs.version != ''
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          sed -i 's/versionName = ".*"/versionName = "'"$NEW_VERSION"'"/' app/build.gradle.kts

      - name: Bump versionCode (100 + github.run_number)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          NEW_CODE=$(( GHA_VERSION_CODE_OFFSET + RUN_NUMBER ))
          sed -i 's/versionCode = [0-9]*/versionCode = '"$NEW_CODE"'/' app/build.gradle.kts
          echo "VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"

      - name: Capture versionName for downstream steps
        run: |
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/versionName = "([^"]+)"/\1/')
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: ./gradlew bundleRelease

      - name: Build signed APK (for GH Release attachment)
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: ./gradlew assembleRelease

      - name: Publish to Play Production (20% rollout)
        run: ./gradlew publishReleaseBundle --track production --user-fraction 0.20 --release-status COMPLETED

      - name: Commit versionCode/versionName bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "release: bump to v${VERSION_NAME} (code ${VERSION_CODE}) [skip ci]"
          git push origin HEAD:main

      - name: Create + push tag
        run: |
          git tag "v${VERSION_NAME}"
          git push origin "v${VERSION_NAME}"

      - name: Create GitHub Release with AAB + APK
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
